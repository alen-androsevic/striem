name: CI

on:
  push:
    branches: [main, next]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # striem.player imports the mpv module at import time, which resolves
      # libmpv through ctypes, and PySide6 needs system GL/xkb libraries even
      # when no QApplication is created.
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libmpv2 libegl1 libgl1 libxkbcommon0

      - run: pip install -e '.[dev]'
      - run: pytest -q

  bundle:
    name: Flatpak bundle
    # Six minutes a run, so it builds only where the result is worth having:
    # merges into main or next, and release tags. Never per pull-request commit.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    container:
      # Pre-seeded flatpak-builder image. Its KDE version only warms the cache:
      # the manifest's 6.11 runtime, SDK and PySide BaseApp are installed from
      # Flathub at build time, so the tag need not match.
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.10
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: striem.flatpak
          manifest-path: flatpak/io.github.striem.Striem.yml
          artifact-name: striem-flatpak
          cache-key: flatpak-builder-${{ hashFiles('flatpak/io.github.striem.Striem.yml') }}

  release:
    name: Stable release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [tests, bundle]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: striem-flatpak

      - name: Publish stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'EOF'
          Download `striem.flatpak` below, then install it:

          ```sh
          flatpak install --user striem.flatpak
          ```
          EOF
          printf '\nWant fixes before they are released? Nightly builds from `next`: https://github.com/%s/releases/tag/nightly\n' \
            "$GITHUB_REPOSITORY" >> notes.md
          gh release create "$GITHUB_REF_NAME" striem.flatpak \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md

  nightly:
    name: Nightly release
    if: github.ref == 'refs/heads/next'
    needs: [tests, bundle]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: striem-flatpak

      # One rolling release on a reused tag: delete it, then recreate it at this
      # commit. --prerelease keeps the newest stable holding the "Latest" badge,
      # so the Releases page still defaults people to stable.
      - name: Publish rolling nightly
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv striem.flatpak striem-nightly.flatpak
          cat > notes.md <<'EOF'
          Unstable rolling build from `next`, replaced on every merge.

          ```sh
          flatpak install --user striem-nightly.flatpak
          ```

          Shares an app ID with stable, so installing this replaces a stable
          install and vice versa.
          EOF
          printf '\nBuilt from %s\n\nLatest stable release: https://github.com/%s/releases/latest\n' \
            "$GITHUB_SHA" "$GITHUB_REPOSITORY" >> notes.md
          # This job never checks out the repo, so every gh call needs --repo:
          # without it gh tries to infer the repository from git and fails. Drop
          # the release and its tag explicitly so create can re-point the tag at
          # this commit. No blanket "|| true" — a swallowed delete is what let a
          # stale nightly survive once already.
          if gh release view nightly --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete nightly --yes --repo "$GITHUB_REPOSITORY"
          fi
          # A tag can outlive its release; if this leaves one behind, create fails
          # loudly rather than quietly publishing against the wrong commit.
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/nightly" >/dev/null 2>&1 || true
          gh release create nightly striem-nightly.flatpak \
            --repo "$GITHUB_REPOSITORY" \
            --title Nightly \
            --prerelease \
            --target "$GITHUB_SHA" \
            --notes-file notes.md
